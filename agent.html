<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 특산물 에이전트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: sans-serif;
      background: #f3f8f4;
    }
    header {
      background: linear-gradient(135deg, #ff9a3c, #ffcc4d);
      color: #fff;
      text-align: center;
      padding: 0.9rem;
      font-weight: bold;
      font-size: 1.1rem;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .bubble {
      max-width: 75%;
      padding: 0.6rem 0.9rem;
      border-radius: 16px;
      line-height: 1.5;
      word-break: break-word;
    }
    .me { align-self: flex-end; background: #ff9a3c; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #fff; color: #263238; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    form {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem;
      background: #fff;
      border-top: 1px solid #e3e3e8;
    }
    input { flex: 1; padding: 0.6rem 0.9rem; border: 1px solid #ddd; border-radius: 999px; font-size: 1rem; }
    button {
      padding: 0.6rem 1.2rem; border: none; border-radius: 999px;
      background: #ff9a3c; color: #fff; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #e67e22; }
    .note { text-align: center; font-size: 0.72rem; color: #90a4ae; padding: 0.35rem; background: #fff; }
  </style>
</head>
<body>
  <header>🍊 제주 특산물 에이전트</header>
  <div id="chat"></div>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="메시지를 입력하세요">
    <button type="submit">보내기</button>
  </form>
  <div class="note">※ 지금 답변은 미리 정해 둔 가짜 답이에요.</div>

  <script>
    const REPLIES = [
      '안녕하세요! 제주도 특산물을 알려 드리는 에이전트예요 🍊 감귤, 흑돼지, 갈치 중에 어떤 게 궁금하세요?',
      '그렇다면 제주 겨울 감귤을 추천해요! 노지 감귤은 11월부터 맛이 제일 좋아요 😋',
      '아직 공부 중이에요! 5일차에 진짜로 알아볼게요.',
    ];
    let turn = 0;

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');

    function addBubble(text, who) {
      const div = document.createElement('div');
      div.className = 'bubble ' + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addBubble(text, 'me');
      input.value = '';

      const reply = REPLIES[turn % REPLIES.length];
      turn++;
      setTimeout(() => addBubble(reply, 'bot'), 1000);
    });
  </script>
</body>
</html>
