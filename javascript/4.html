<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function plus(a,b){
            return a+b
        }
        function minus(a,b){
            return a-b
        }
        function multiply(a,b){
            return a*b
        }
        function divide(a,b){
            return a/b
        }
        function modulo(a,b){
            return a%b
        }
        // head 안에서는 body가 아직 없으므로, 문서가 다 읽힌 뒤에 버튼에 이벤트를 연결한다.
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelector('button#plus').addEventListener('mouseover', function () {
                console.log(plus(4, 6));
            });
            document.querySelector('button#minus').addEventListener('mouseover', function () {
                console.log(minus(4, 6));
            });
            document.querySelector('button#mul').addEventListener('mouseover', function () {
                console.log(multiply(4, 6));
            });
            document.querySelector('button#div').addEventListener('mouseover', function () {
                console.log(divide(4, 6));
            });
            document.querySelector('button#mod').addEventListener('mouseover', function () {
                console.log(modulo(4, 6));
            });

        });
    </script>
</head>
<body>
    안녕하세요
    <h1>
        반갑습니다
    </h1>
    <h2>
        반갑습니다
    </h2>
    <button id="plus" >덧셈</button>
    <button id="minus" >뺄셈</button>
    <button id="mul" >곱하기</button>
    <button id="div" >나누기</button>
    <button id="mod" >나머지</button>
</body>
</html>
